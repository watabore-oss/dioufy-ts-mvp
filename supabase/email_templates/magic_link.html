<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Votre lien de connexion magique Dioufy-TS</title>
</head>
<body style="margin: 0; padding: 0; background-color: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color: #F8FAFC; padding: 30px 15px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" style="max-width: 560px; background-color: #FFFFFF; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(15, 23, 42, 0.08); border: 1px solid #E2E8F0;">
          <tr>
            <td style="background: linear-gradient(135deg, #0F172A 0%, #065F46 100%); padding: 32px 24px; text-align: center;">
              <h1 style="color: #FFFFFF; margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.5px;">Dioufy-TS</h1>
              <p style="color: #FBBF24; margin: 6px 0 0 0; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">Fo nek sa gare fek lafa</p>
            </td>
          </tr>
          <tr>
            <td style="padding: 32px 28px;">
              <h2 style="color: #0F172A; font-size: 20px; font-weight: 700; margin: 0 0 12px 0;">Connexion Rapide sans Mot de Passe</h2>
              <p style="color: #475569; font-size: 15px; line-height: 1.6; margin: 0 0 24px 0;">
                Cliquez sur le bouton ci-dessous ou saisissez le code de session pour accéder directement à votre espace Dioufy-TS :
              </p>

              <div style="background-color: #ECFDF5; border: 2px dashed #10B981; border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 26px;">
                <span style="display: block; font-size: 12px; font-weight: 700; color: #065F46; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px;">Votre Code de Session</span>
                <span style="font-size: 34px; font-weight: 900; letter-spacing: 8px; color: #065F46; font-family: monospace;">{{ .Token }}</span>
              </div>

              <div style="text-align: center; margin-bottom: 24px;">
                <a href="{{ .ConfirmationURL }}" style="display: inline-block; background: linear-gradient(135deg, #065F46 0%, #047857 100%); color: #FFFFFF; text-decoration: none; padding: 14px 32px; font-size: 15px; font-weight: 700; border-radius: 10px; box-shadow: 0 4px 12px rgba(6, 95, 70, 0.25);">
                  Se Connecter Instantanément
                </a>
              </div>
            </td>
          </tr>
          <tr>
            <td style="background-color: #F8FAFC; border-top: 1px solid #E2E8F0; padding: 20px 24px; text-align: center;">
              <p style="color: #64748B; font-size: 12px; margin: 0;">
                © 2026 <strong>Dioufy-TS</strong> • Fo nek sa gare fek lafa.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
